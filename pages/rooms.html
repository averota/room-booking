<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manage rooms · Roombook</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../assets/css/styles.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-md app-nav">
  <div class="container-fluid" style="max-width:1180px; margin:0 auto;">
    <a class="navbar-brand" href="dashboard.html">
      <span class="mark">R</span> Roombook
    </a>
    <div class="d-flex align-items-center gap-3 order-md-3">
      <span class="role-badge admin" id="roleBadge">Admin</span>
      <div class="d-flex align-items-center gap-2">
        <span class="mark" id="userAvatar" style="background:var(--ink);">?</span>
        <span id="userName" style="font-size:0.9rem; font-weight:600;"></span>
      </div>
      <button class="btn btn-sm btn-outline-secondary" id="logoutBtn">Log out</button>
    </div>
    <button class="navbar-toggler order-md-2" type="button" data-bs-toggle="collapse" data-bs-target="#navLinks">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse order-md-2" id="navLinks">
      <ul class="navbar-nav me-auto mb-2 mb-md-0 ms-md-4">
        <li class="nav-item"><a class="nav-link app-link" href="dashboard.html">Calendar</a></li>
        <li class="nav-item"><a class="nav-link app-link active" href="rooms.html">Manage rooms</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="page-wrap">

  <div class="room-meta-bar">
    <div>
      <h2>Manage rooms</h2>
      <div class="meta">Add, edit, or retire the meeting rooms staff can book.</div>
    </div>
    <button class="btn btn-accent" id="addRoomBtn">+ Add room</button>
  </div>

  <div id="adminGate" class="empty-state" style="display:none;">
    You need admin access to view this page. <a href="dashboard.html">Back to calendar</a>.
  </div>

  <div class="room-manage-card" id="roomTableWrap">
    <table class="table mb-0 align-middle">
      <thead>
        <tr>
          <th>Name</th>
          <th>Location</th>
          <th>Capacity</th>
          <th>Status</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="roomTableBody"></tbody>
    </table>
    <div class="empty-state" id="roomsEmptyState" style="display:none;">No rooms yet — add your first one.</div>
  </div>

</div>

<!-- Add / edit room modal -->
<div class="modal fade" id="roomModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="roomForm">
        <div class="modal-header">
          <h5 class="modal-title" id="roomModalTitle">Add room</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Room name</label>
            <input type="text" class="form-control" id="roomNameInput" placeholder="e.g. Harbor" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Location</label>
            <input type="text" class="form-control" id="roomLocationInput" placeholder="e.g. Level 2, East Wing">
          </div>
          <div class="mb-3">
            <label class="form-label">Capacity</label>
            <input type="number" min="1" class="form-control" id="roomCapacityInput" value="4" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" id="roomDescriptionInput" rows="2" placeholder="Equipment, notes, anything worth knowing"></textarea>
          </div>
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="roomActiveInput" checked>
            <label class="form-check-label" for="roomActiveInput">Visible to staff for booking</label>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-accent" id="roomSubmitBtn">Save room</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/supabaseClient.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/utils.js"></script>
<script src="../assets/js/admin.js"></script>
</body>
</html>
